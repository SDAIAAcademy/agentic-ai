[project]
name = "agentic-ai-labs"
version = "1.0.0"
description = "Lab notebooks for the SDAIA Academy Agentic AI Systems Engineering bootcamp"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=3.30",
    "pydantic>=2.12",
    "python-dotenv>=1.1",
    "httpx>=0.28",
    "huggingface-hub>=2.0",
    "model2vec>=0.10",
    "bm25s>=0.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "mcp>=2.3",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "a2a-sdk[http-server]>=1.2",
    "fastapi>=0.150",
    "uvicorn>=0.40",
    "opentelemetry-sdk>=1.45",
    "pytest>=9.0",
    "jupyterlab>=4.4",
    "ipywidgets>=8.1",
    "nbconvert>=7.16",
    "anthropic>=1.0",
    "openai-agents>=0.24",
    "uv>=0.13.4",
]

[tool.uv]
package = false
